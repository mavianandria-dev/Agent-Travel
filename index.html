<html lang="id">
<head>

tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['"Plus Jakarta Sans"','system-ui','sans-serif'] },

<style>
*{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
body{background:#f1f5f9}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(15,122,229,.4)}100%{box-shadow:0 0 0 14px rgba(15,122,229,0)}}
.anim{animation:fadeUp .45s cubic-bezier(.21,.9,.35,1) both}
.anim-1{animation-delay:.05s}.anim-2{animation-delay:.12s}.anim-3{animation-delay:.2s}.anim-4{animation-delay:.28s}
.modal-bg{background:rgba(11,36,71,.55);backdrop-filter:blur(6px)}
.skel{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 37%,#e2e8f0 63%);background-size:800px 100%;animation:shimmer 1.3s infinite linear;border-radius:12px}
.seat{transition:all .22s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
.seat.avail{background:#dcfce7;border:2px solid #22c55e;color:#15803d}
.seat.avail:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 18px -6px rgba(34,197,94,.5)}
.seat.selected{background:#0f7ae5;border:2px solid #0b63c4;color:#fff;animation:pulseRing 1.2s infinite}
.seat.filled{background:#e2e8f0;border:2px solid #cbd5e1;color:#94a3b8;cursor:not-allowed;text-decoration:line-through}
.seat.held{background:#fef3c7;border:2px dashed #f59e0b;color:#b45309;cursor:not-allowed}
.seat.driver{background:#0b2447;border:2px solid #0b2447;color:#fff;cursor:default}
.car-body{background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);border:3px solid #0b2447;border-radius:42px 42px 26px 26px;position:relative}
.car-windshield{background:linear-gradient(180deg,#bae6fd,#e0f2fe);border:2px solid #0b2447;border-radius:18px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.b-pending{background:#fef3c7;color:#92400e}.b-paid{background:#dcfce7;color:#166534}.b-cancel{background:#fee2e2;color:#991b1b}.b-done{background:#dbeafe;color:#1e40af}.b-wait{background:#f1f5f9;color:#475569}
.step-dot{width:32px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;transition:all .3s}
.navbtn{transition:all .2s}.navbtn.active{background:#0b2447;color:#fff;box-shadow:0 8px 20px -8px rgba(11,36,71,.5)}
.navbtn:not(.active):hover{background:#e2e8f0}
input,select,textarea{outline:none}.focus-ring:focus{border-color:#0f7ae5!important;box-shadow:0 0 0 3px rgba(15,122,229,.18)}
.card-hover{transition:all .25s}.card-hover:hover{transform:translateY(-4px);box-shadow:0 20px 40px -15px rgba(11,36,71,.3)}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- MOBILE FRIENDLY ---------- */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button,a{touch-action:manipulation;min-height:0}
#roleTabs,.hscroll{scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
#roleTabs::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
#roleTabs>*{scroll-snap-align:start;flex-shrink:0}
input,select,textarea{font-size:16px!important}
@media(min-width:768px){input,select,textarea{font-size:13px!important}}
.btn-touch{min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.seat{min-height:64px;min-width:64px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;margin:0 -4px;padding:0 4px}
@media(max-width:640px){
  main{padding-left:12px!important;padding-right:12px!important}
  .car-body{max-width:320px!important}
  .step-dot{width:28px;height:28px;font-size:12px}
  table.data td,table.data th{padding:9px 10px}
  #toasts{top:auto!important;bottom:86px!important;left:12px!important;right:12px!important;width:auto!important}
  #modalBox{border-radius:24px 24px 0 0!important;max-height:94dvh!important}
  #modalBox::before{content:'';display:block;width:44px;height:5px;border-radius:99px;background:#e2e8f0;margin:10px auto 0}
  .chart-box{height:190px!important}
}
@media print{ .no-print{display:none!important} .print-only{display:block!important} body{background:#fff} }
.print-only{display:none}
.toast-in{animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
table.data th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:800;text-align:left;padding:10px 12px;background:#f8fafc;white-space:nowrap}
table.data td{padding:11px 12px;font-size:13px;border-top:1px solid #f1f5f9;vertical-align:middle}
table.data tr:hover td{background:#f8fafc}
</style>
</head>
<body class="text-slate-800">

<!-- TOPBAR -->
<header class="no-print sticky top-0 z-40 bg-[#0b2447]/95 backdrop-blur border-b border-white/10 text-white" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 h-[58px] flex items-center gap-2 sm:gap-3">
    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center shadow-lg shrink-0">
      <i data-lucide="car-front" class="w-5 h-5 sm:w-6 sm:h-6 text-white"></i>
    </div>
    <div class="leading-tight min-w-0">
      <div class="font-extrabold tracking-tight text-[15px] sm:text-[17px]">Trans<span class="text-sky-400">Aceh</span></div>
      <div class="text-[10px] sm:text-[11px] text-slate-300 font-medium -mt-0.5 truncate">Travel Antar Kota • Calang – B. Aceh</div>
    </div>
    <div class="flex-1"></div>
    <div class="hidden md:flex items-center gap-2 text-[12px] font-semibold bg-white/10 rounded-full px-3 py-1.5">
      <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span><span id="clock">--:--</span><span class="text-slate-300">WIB</span>
    </div>
    <button onclick="toggleLang()" aria-label="Ganti bahasa" class="text-[12px] font-extrabold bg-white/10 hover:bg-white/20 active:scale-95 rounded-full px-3 py-2 flex items-center gap-1.5 transition min-h-[40px]"><i data-lucide="languages" class="w-3.5 h-3.5"></i><span id="langLabel">ID</span></button>
    <button onclick="openNotif()" aria-label="Notifikasi" class="relative w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center transition">
      <i data-lucide="bell" class="w-5 h-5"></i>
      <span id="notifDot" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-[#0b2447]"></span>
    </button>
    <div id="topUser"></div>
  </div>
  <div id="roleTabs" class="hscroll max-w-7xl mx-auto px-3 sm:px-4 pb-2.5 flex gap-2 overflow-x-auto"></div>
</header>

<!-- HERO / PUBLIC -->
<div id="publicHero"></div>

<main class="max-w-7xl mx-auto px-3 sm:px-4 pb-32 md:pb-16 pt-3 sm:pt-5 min-h-[70vh]">
  <div id="skeleton" class="hidden space-y-3">
    <div class="skel h-14"></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="skel h-40"></div><div class="skel h-40"></div><div class="skel h-40"></div></div><div class="skel h-56"></div>
  </div>
  <div id="app"></div>
</main>

<!-- MOBILE BOTTOM NAV -->
<nav class="no-print md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/97 backdrop-blur border-t border-slate-200 px-2 pt-1.5 flex gap-1 overflow-x-auto shadow-[0_-8px_30px_-12px_rgba(11,36,71,.25)]" style="padding-bottom:max(10px,env(safe-area-inset-bottom))" id="bottomNav"></nav>

<!-- MODAL + TOAST -->
<div id="modal" class="hidden fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeModal()">
  <div id="modalBox" class="bg-white w-full sm:max-w-lg sm:rounded-3xl rounded-t-3xl max-h-[92vh] overflow-y-auto shadow-pop anim" style="animation:pop .3s both"></div>
</div>
<div id="toasts" class="fixed z-[60] top-4 right-4 space-y-2 w-[320px] max-w-[calc(100vw-2rem)]"></div>

<script>
/* ============================================================
   TransAceh — Single-file Travel Booking Platform
   DB: localStorage simulation • 4 roles • realtime seat lock
============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmtRp = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
const todayStr = (off=0) => { const d=new Date(); d.setDate(d.getDate()+off); return d.toISOString().slice(0,10); };
const uid = p => (p||'ID')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEAT_LABELS = ['A1','A2','A3','A4','A5','A6'];
/* Daftar kabupaten/kota Aceh (23) & Sumatera Utara (33) */
const REGIONS=[
 {p:'Aceh',c:['Banda Aceh','Sabang','Langsa','Lhokseumawe','Subulussalam','Aceh Besar','Aceh Barat','Aceh Barat Daya','Aceh Jaya','Aceh Selatan','Aceh Singkil','Aceh Tamiang','Aceh Tengah','Aceh Tenggara','Aceh Timur','Aceh Utara','Bener Meriah','Bireuen','Gayo Lues','Nagan Raya','Pidie','Pidie Jaya','Simeulue']},
 {p:'Sumatera Utara',c:['Medan','Binjai','Tebing Tinggi','Pematangsiantar','Tanjungbalai','Sibolga','Padangsidimpuan','Gunungsitoli','Asahan','Batubara','Dairi','Deli Serdang','Humbang Hasundutan','Karo','Labuhanbatu','Labuhanbatu Selatan','Labuhanbatu Utara','Langkat','Mandailing Natal','Nias','Nias Barat','Nias Selatan','Nias Utara','Padang Lawas','Padang Lawas Utara','Pakpak Bharat','Samosir','Serdang Bedagai','Simalungun','Tapanuli Selatan','Tapanuli Tengah','Tapanuli Utara','Toba']}
];
const regionOptions=(sel)=>REGIONS.map(g=>`<optgroup label="${g.p}">${g.c.map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join('')}</optgroup>`).join('');
/* SIM terstruktur: simType (A/B1/B2) + simExp (tahun kedaluwarsa) */
const SIM_TYPES=['A','B1','B2'];
const GENDERS=['Laki-laki','Perempuan'];
const MARITALS=['Belum menikah','Menikah','Lainnya'];
const EDUCATIONS=['SD','SMP','SMA','SMK','Diploma','Sarjana','Pascasarjana'];
function simParse(d){ const cur=new Date().getFullYear();
  if(d&&(d.simType||d.simExp)) return {type:(typeof d.simType==='string'&&d.simType.trim())?d.simType.trim():'A',exp:Number(d.simExp)||cur+5};
  const m=d&&d.sim?/SIM\s*([A-Z0-9]+)\s*•\s*(?:(\d{4})\s*-)?(\d{4})/.exec(d.sim):null;
  return {type:m&&SIM_TYPES.includes(m[1])?m[1]:'A',exp:m?Number(m[3]):cur+5};
}
function simLabel(d){ const s=simParse(d); return 'SIM '+s.type+' • s.d. '+s.exp; }
function simExpired(d){ return simParse(d).exp<new Date().getFullYear(); }
const simTypeOptions=(sel)=>`<option value="">— Pilih —</option>`+SIM_TYPES.map(t=>`<option value="${t}" ${t===sel?'selected':''}>SIM ${t}</option>`).join('')+`<option value="Lainnya" ${sel&&!SIM_TYPES.includes(sel)?'selected':''}>SIM lainnya…</option>`;
const pillRadios=(name,opts,sel,oc)=>`<div class="flex flex-wrap gap-1.5 mt-1">${opts.map(o=>`<label class="shrink-0"><input type="radio" name="${name}" value="${o}" ${o===sel?'checked':''} ${oc?`onchange="${oc}"`:''} class="hidden peer"><span class="inline-block px-3.5 py-2 rounded-xl border-2 text-[12.5px] font-extrabold transition cursor-pointer bg-white border-slate-200 text-slate-500 peer-checked:bg-sky-600 peer-checked:border-sky-600 peer-checked:text-white">${o}</span></label>`).join('')}</div>`;
let DRV_FOTOS={};
function drvUpBox(kind,title,req,src){ return `<div><label class="text-[12px] font-extrabold">${title}${req?' <span class="text-red-500">*</span>':''}</label>
  <div class="mt-1 flex items-center gap-3"><img id="drvPrev_${kind}" src="${src||''}" class="${src?'':'hidden'} w-16 h-16 rounded-2xl object-cover border-2 border-slate-200 shrink-0">
  <label class="flex-1 cursor-pointer border-2 border-dashed border-slate-300 hover:border-sky-400 rounded-2xl px-4 py-3 text-center text-[12.5px] font-bold text-slate-500 transition">Pilih foto<input type="file" accept="image/*" class="hidden" onchange="drvUp(this,'${kind}')"></label></div></div>`; }
function drvUp(input,kind){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>700*1024){ toast('Foto maksimal 700KB — kecilkan dulu','err'); input.value=''; return; }
  const r=new FileReader();
  r.onload=()=>{ DRV_FOTOS[kind]=r.result; const img=document.getElementById('drvPrev_'+kind); if(img){ img.src=r.result; img.classList.remove('hidden'); } };
  r.readAsDataURL(f);
}
let VEH_DOCS={};
let VEH_AUTOFILL=false;
function vehUpBox(kind,title,req,src){ return `<div><label class="text-[12px] font-extrabold">${title}${req?' <span class="text-red-500">*</span>':''}</label>
  <div class="mt-1 flex items-center gap-3"><img id="vehPrev_${kind}" src="${src||''}" class="${src?'':'hidden'} w-16 h-16 rounded-2xl object-cover border-2 border-slate-200 shrink-0">
  <label class="flex-1 cursor-pointer border-2 border-dashed border-slate-300 hover:border-sky-400 rounded-2xl px-4 py-3 text-center text-[12.5px] font-bold text-slate-500 transition">Pilih foto<input type="file" accept="image/*" class="hidden" onchange="vehUp(this,'${kind}')"></label></div></div>`; }
function vehUp(input,kind){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>700*1024){ toast('Foto maksimal 700KB — kecilkan dulu','err'); input.value=''; return; }
  const r=new FileReader();
  r.onload=()=>{ VEH_DOCS[kind]=r.result; const img=document.getElementById('vehPrev_'+kind); if(img){ img.src=r.result; img.classList.remove('hidden'); } };
  r.readAsDataURL(f);
}
let LANG = localStorage.getItem('at_lang')||'id';
const T = {
  id:{book:'Pesan Sekarang',search:'Cari Travel',myticket:'Tiket Saya',history:'Riwayat',dashboard:'Dashboard',vehicles:'Armada',drivers:'Pengemudi',schedules:'Jadwal',bookings:'Pesanan',finance:'Keuangan',settings:'Pengaturan',tasks:'Tugas Saya',agencies:'Agen Travel',transactions:'Transaksi',master:'Master Data',logout:'Keluar',login:'Masuk',register:'Daftar'},
  en:{book:'Book Now',search:'Search Travel',myticket:'My Tickets',history:'History',dashboard:'Dashboard',vehicles:'Vehicles',drivers:'Drivers',schedules:'Schedules',bookings:'Bookings',finance:'Finance',settings:'Settings',tasks:'My Tasks',agencies:'Agencies',transactions:'Transactions',master:'Master Data',logout:'Logout',login:'Login',register:'Register'}
};
const t = k => (T[LANG]&&T[LANG][k])||T.id[k]||k;

/* ---------- DB layer (localStorage simulation) ---------- */
const DB = {
  load(k,f){ try{ const v=localStorage.getItem('at_'+k); return v?JSON.parse(v):f; }catch(e){ return f; } },
  save(k,v){ localStorage.setItem('at_'+k, JSON.stringify(v)); }
};
function audit(action, detail){ const l=DB.load('audit',[]); const u=currentUser(); l.unshift({id:uid('LOG'),time:new Date().toISOString(),actor:u?u.email+' ('+u.role+')':'guest',action,detail:detail||''}); DB.save('audit',l.slice(0,300)); }
function notify(userEmail, title, msg, ch){
  const n=DB.load('notifications',[]);
  n.unshift({id:uid('NTF'),to:userEmail,title,msg,ch:ch||'app',time:new Date().toISOString(),read:false});
  DB.save('notifications',n.slice(0,200));
}

/* ---------- SEED ---------- */

  const seedSim=(t,nm,num,exp)=>svgURI(`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='200'><rect width='320' height='200' rx='16' fill='#0b2447'/><rect x='16' y='16' width='288' height='168' rx='12' fill='none' stroke='#38bdf8' stroke-width='2'/><text x='28' y='52' font-family='Arial,sans-serif' font-size='22' font-weight='bold' fill='#7dd3fc'>SIM ${t} • DEMO</text><text x='28' y='92' font-family='Arial,sans-serif' font-size='17' font-weight='bold' fill='#fff'>${nm}</text><text x='28' y='118' font-family='Arial,sans-serif' font-size='14' fill='#cbd5e1'>${num}</text><text x='28' y='144' font-family='Arial,sans-serif' font-size='14' fill='#cbd5e1'>Berlaku s.d. ${exp}</text><text x='28' y='168' font-family='Arial,sans-serif' font-size='11' fill='#64748b'>Contoh seed — ganti dengan foto asli</text></svg>`);
  const users=[
    {id:'U-SA',name:'Super Admin',email:'admin@transaceh.id',phone:'0811000001',pass:'admin123',role:'superadmin',agencyId:null,status:'active',photo:''},
    {id:'U-AG1',name:'Cut Meutia (Barakah)',email:'agen@barakah.com',phone:'0812000001',pass:'agen123',role:'agen',agencyId:'AG1',status:'active',photo:''},
    {id:'U-DR1',name:'Bang Jamil',email:'pengemudi@barakah.com',phone:'0812000002',pass:'pengemudi123',role:'pengemudi',agencyId:'AG1',status:'active',profileStep:'done',photo:''},
    {id:'U-AG2',name:'Faisal (Putra Jaya)',email:'agen@putrajaya.com',phone:'0812000010',pass:'agen123',role:'agen',agencyId:'AG2',status:'active',photo:''},
    {id:'U-AG3',name:'Rizky (Lintas Utara)',email:'agen@lintasutara.com',phone:'0812000020',pass:'agen123',role:'agen',agencyId:'AG3',status:'active',photo:''},
    {id:'U-DR4',name:'Bang Hendra',email:'pengemudi@putrajaya.com',phone:'0812000011',pass:'pengemudi123',role:'pengemudi',agencyId:'AG2',status:'active',profileStep:'done',photo:''},
    {id:'U-DR7',name:'Ilham Saputra',email:'pengemudibaru@mail.com',phone:'0812000099',pass:'pengemudi123',role:'pengemudi',agencyId:'AG1',status:'active',profileStep:'done',photo:''},
    {id:'U-DR2',name:'Teuku Rizal',email:'teuku.rizal@barakah.com',phone:'0812000003',pass:'pengemudi123',role:'pengemudi',agencyId:'AG1',status:'active',profileStep:'done',photo:''},
    {id:'U-DR3',name:'Pak Umar',email:'pak.umar@barakah.com',phone:'0812000004',pass:'pengemudi123',role:'pengemudi',agencyId:'AG1',status:'nonaktif',profileStep:'done',photo:''},
    {id:'U-DR5',name:'Dedi Saputra',email:'dedi@putrajaya.com',phone:'0812000012',pass:'pengemudi123',role:'pengemudi',agencyId:'AG2',status:'active',profileStep:'done',photo:''},
    {id:'U-DR6',name:'Agus Medan',email:'agus@lintasutara.com',phone:'0812000021',pass:'pengemudi123',role:'pengemudi',agencyId:'AG3',status:'active',profileStep:'done',photo:''},
    {id:'U-AG4',name:'Nasir (Cahaya)',email:'agen@cahaya.com',phone:'0812000030',pass:'agen123',role:'agen',agencyId:'AG4',status:'pending',photo:''},
    {id:'U-CS1',name:'Pelanggan Demo',email:'user@demo.com',phone:'0813000001',pass:'user123',role:'pelanggan',agencyId:null,status:'active',photo:'',favorites:[{name:'Ayah',phone:'0813000002'}]},
  ];

(function migrateRoutesV2(){
  try{
    if(!localStorage.getItem('at_seeded_v1')||localStorage.getItem('at_seeded_v2')) return;
    const fix={Calang:'Aceh Jaya',Meulaboh:'Aceh Barat'};
    const rs=DB.load('routes',[]); let ch=false;
    rs.forEach(r=>{
      if(fix[r.from]){ r.from=fix[r.from]; ch=true; }
      if(fix[r.to]){ r.to=fix[r.to]; ch=true; }
      if(!Array.isArray(r.agencyIds)){ r.agencyIds=r.agencyId?[r.agencyId]:['AG1']; ch=true; }
      if(!Array.isArray(r.driverIds)){ r.driverIds=r.driverId?[r.driverId]:[]; ch=true; }
      if(!r.agencyId&&r.agencyIds.length){ r.agencyId=r.agencyIds[0]; ch=true; }
      if(!r.driverId&&r.driverIds.length){ r.driverId=r.driverIds[0]; ch=true; }
      if(Array.isArray(r.pickups)) r.pickups=r.pickups.map(p=>p.replace('Terminal Calang','Terminal Aceh Jaya').replace('Terminal Meulaboh','Terminal Aceh Barat'));
    });
    if(ch) DB.save('routes',rs);
    localStorage.setItem('at_seeded_v2','1');
  }catch(e){}
})();

/* ---------- Session & helpers ---------- */
function currentUser(){ const s=DB.load('session',null); if(!s) return null; return DB.load('users',[]).find(u=>u.id===s.uid)||null; }
function setSession(u){ if(u) DB.save('session',{uid:u.id}); else localStorage.removeItem('at_session'); }
function agencyOf(u){ if(!u) return null; return DB.load('agencies',[]).find(a=>a.id===u.agencyId); }
function routeById(id){ return DB.load('routes',[]).find(r=>r.id===id); }
function vehicleById(id){ return DB.load('vehicles',[]).find(v=>v.id===id); }
function vehName(v){ return v?(((v.brand||'')+(v.model?' '+v.model:'')).trim()||'Armada'):''; }
function driverById(id){ return DB.load('drivers',[]).find(d=>d.id===id); }
function schedById(id){ return DB.load('schedules',[]).find(s=>s.id===id); }
function agencyById(id){ return DB.load('agencies',[]).find(a=>a.id===id); }
function bookingsOf(schedId){ return DB.load('bookings',[]).filter(b=>b.scheduleId===schedId && b.status!=='cancelled'); }
function takenSeats(schedId){
  const sch=schedById(schedId); const out={paid:[],hold:[],inactive:[]};
  bookingsOf(schedId).forEach(b=>{ (b.seats||[]).forEach(s=>{ if(b.status==='paid'||b.status==='done') out.paid.push(s); else if(b.status==='pending') out.hold.push(s); }); });
  (sch?.blockedSeats||[]).forEach(s=>{ if(!out.paid.includes(s)) out.paid.push(s); });
  const veh=sch?vehicleById(sch.vehicleId):null;
  (veh?.inactiveSeats||[]).forEach(s=>{ if(!out.paid.includes(s)) out.paid.push(s); if(!out.inactive.includes(s)) out.inactive.push(s); });
  return out;
}
function seatsLeft(schedId){ return schedSeatCap(schedId) - takenSeats(schedId).paid.length - takenSeats(schedId).hold.length; }
/* Layout kabin 4 kolom x 7 baris per armada. Sel: empty|seat|off|driver|door|aisle|luggage */
function vehLayout(v){
  if(v&&Array.isArray(v.layout)&&v.layout.length===28) return v.layout.map(c=>({sid:c.sid||null,type:c.type||'empty'}));
  const L=Array.from({length:28},()=>({sid:null,type:'empty'}));
  const put=(i,type,sid)=>{L[i]={sid:sid||null,type};};
  put(2,'driver','DRV'); put(3,'driver','DRV2');
  ['A1','A2','A3','A4','A5','A6'].forEach((s,k)=>put([0,1,4,5,8,9][k],'seat',s));
  ((v&&v.inactiveSeats)||[]).forEach(s=>{const c=L.find(x=>x.sid===s); if(c) c.type='off';});
  [24,25,26,27].forEach(i=>put(i,'luggage',null));
  return L;
}
function vehSeatCount(v){ return vehLayout(v).filter(c=>c.type==='seat').length; }
function schedSeatCap(schedId){ const s=schedById(schedId); if(!s) return 6; return Math.max(1,vehSeatCount(vehicleById(s.vehicleId))); }
function schedReady(s){ if(!s||s.status!=='open') return false; const v=s.vehicleId?vehicleById(s.vehicleId):null, d=s.driverId?driverById(s.driverId):null; return (!v||v.status==='aktif')&&(!d||d.status==='aktif'); }
function drvBlocks(L){ let n=0; for(let r=0;r<7;r++){ const a=L[r*4+2],b=L[r*4+3]; if(a&&b&&a.type==='driver'&&b.type==='driver') n++; } return n; }
function seatBookedFuture(vid,sid){
  return DB.load('schedules',[]).filter(s=>s.vehicleId===vid&&s.date>=todayStr(0)).some(s=>bookingsOf(s.id).some(b=>(b.seats||[]).includes(sid)));
}
function cleanupHolds(){
  let arr=DB.load('bookings',[]); let changed=false;
  const now=Date.now();
  arr.forEach(b=>{ if(b.status==='pending'&&b.holdExpiry&&now>new Date(b.holdExpiry).getTime()){ b.status='cancelled'; b.cancelReason='Hold kedaluwarsa (15 mnt)'; changed=true; processWaiting(b.scheduleId);} });
  if(changed) DB.save('bookings',arr);
}
setInterval(cleanupHolds, 10000); cleanupHolds();
function processWaiting(schedId){
  const w=DB.load('waiting',[]); const idx=w.findIndex(x=>x.scheduleId===schedId);
  if(idx>=0 && seatsLeft(schedId)>0){ const item=w.splice(idx,1)[0]; DB.save('waiting',w); notify(item.userEmail,'Kursi tersedia!','Kursi pada jadwal '+schedId+' kini tersedia ('+seatsLeft(schedId)+' sisa). Segera booking.','WA'); }
}
function feeFor(agencyId, amount){ const a=agencyById(agencyId); if(!a) return Math.round(amount*0.08); return a.feeType==='flat'? a.feeValue : Math.round(amount*a.feeValue/100); }

function paxCell(c,tk){

  if(c.type==='driver') return `<div class="seat driver rounded-xl h-[58px] flex flex-col items-center justify-center text-[10px] font-extrabold"><i data-lucide="circle-gauge" class="w-5 h-5 pointer-events-none"></i>PENGEMUDI</div>`;
  if(c.type==='door') return `<div class="rounded-xl h-[58px] bg-amber-100 border-2 border-amber-300 flex flex-col items-center justify-center text-[9px] font-extrabold text-amber-700"><i data-lucide="door-open" class="w-4 h-4"></i>PINTU</div>`;
  if(c.type==='luggage') return `<div class="rounded-xl h-[58px] bg-slate-100 border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-[9px] font-extrabold text-slate-400"><i data-lucide="luggage" class="w-4 h-4"></i>BAGASI</div>`;
  return `<div class="h-[58px]"></div>`;
}
function seatBtn(st,tk,bw){
  let cls='avail', extra='', dis='';
  if((tk.inactive||[]).includes(st)){cls='filled';dis='disabled';extra='nonaktif';}
  else if(tk.paid.includes(st)){cls='filled';dis='disabled';extra='';}
  else if(tk.hold.includes(st)){cls='held';dis='disabled';}
  else if(bw.seats.includes(st)){cls='selected';}
  return `<button ${dis} onclick="toggleSeat('${st}')" aria-label="Kursi ${st}${extra==='nonaktif'?' nonaktif':''}" class="seat ${cls} rounded-xl h-[58px] min-h-[54px] flex flex-col items-center justify-center font-extrabold text-[14px] active:scale-95" ${extra==='nonaktif'?'title="Nonaktif oleh agen"':''}>${extra==='nonaktif'?'<i data-lucide="ban" class="w-4 h-4"></i>':cls==='filled'?'<i data-lucide="x" class="w-4 h-4"></i>':cls==='held'?'<i data-lucide="timer" class="w-4 h-4"></i>':'<i data-lucide="armchair" class="w-4 h-4"></i>'}<span class="text-[11px]">${st}</span>${extra==='nonaktif'?'<span class="text-[8px] font-extrabold">OFF</span>':''}</button>`;
}
let PAY_METHOD='QRIS';

function wizNav(back,next){

  ${next?`<button onclick="wizNext()" class="btn-touch flex-[2] bg-[#0b2447] hover:bg-sky-600 active:scale-[.98] text-white font-extrabold text-[14px] py-3.5 rounded-2xl transition flex items-center justify-center gap-2 shadow-lg">Lanjut<i data-lucide="arrow-right" class="w-4 h-4"></i></button>`:''}</div>`;

function wizNext(){
  if(BW.step===1&&!BW.routeId) return toast('Pilih rute dulu','warn');
  if(BW.step===3&&!BW.scheduleId) return toast('Pilih armada / jadwal dulu','warn');
  if(BW.step===3&&BW.scheduleId&&!schedReady(schedById(BW.scheduleId))){ BW.scheduleId=null; refreshWiz(); return toast('Jadwal tidak tersedia (armada maintenance / pengemudi nonaktif / ditutup) — pilih yang lain','err'); }
  if(BW.step===4){ if(!BW.seats.length) return toast('Pilih minimal 1 kursi','warn');

    if(bad) return toast('Lengkapi nama & HP semua penumpang','warn');

}

function toggleSeat(st){
  if(BW.seats.includes(st)){ BW.seats=BW.seats.filter(x=>x!==st); BW.passengers=BW.passengers.filter(p=>p.seat!==st); }
  else { const maxS=schedSeatCap(BW.scheduleId); if(BW.seats.length>=maxS) return toast('Maksimal '+maxS+' kursi per booking','warn'); BW.seats.push(st); if(!BW.passengers.find(p=>p.seat===st)) BW.passengers.push({seat:st,name:'',phone:''}); toast('Kursi '+st+' dipilih','info'); }
  refreshWiz();
}
function setPax(seat,f,val){ let p=BW.passengers.find(x=>x.seat===seat); if(!p){p={seat,name:'',phone:''};BW.passengers.push(p);} p[f]=val; }
function applyVoucherCalc(){
  BW.discount=0; if(!BW.voucher) return;
  const v=DB.load('vouchers',[]).find(x=>x.code===BW.voucher.toUpperCase()&&x.active);
  if(!v) return;
  const s=schedById(BW.scheduleId); const sub=s.price*BW.seats.length;
  BW.discount = v.type==='percent' ? Math.min(Math.round(sub*v.value/100), v.maxDisc||sub) : Math.min(v.value,sub);
}
function applyVoucher(){
  BW.voucher=$('#vCode').value.trim().toUpperCase(); applyVoucherCalc();
  if(BW.discount>0) toast('Voucher '+BW.voucher+' dipakai: hemat '+fmtRp(BW.discount));
  else toast('Kode voucher tidak valid / kedaluwarsa','err');
  refreshWiz();
}
function joinWaiting(){
  const u=currentUser(); if(!u) return go('login');
  const sid=BW.scheduleId||(stepSchedules()[0]||{}).id; if(!sid) return toast('Pilih jadwal dulu','warn');
  const w=DB.load('waiting',[]); w.push({id:uid('WL'),scheduleId:sid,userEmail:u.email,time:new Date().toISOString()});
  DB.save('waiting',w); audit('waiting_list',u.email+' → '+sid); toast('Masuk waiting list. Kami notifikasi via WA jika ada kursi kosong.','ok');
}
function doCheckout(){
  const u=currentUser(); if(!u){ toast('Login dulu untuk booking','warn'); return go('login'); }
  const s=schedById(BW.scheduleId); const tk=takenSeats(s.id);
  const clash=BW.seats.find(x=>tk.paid.includes(x)||tk.hold.includes(x));
  if(clash){ toast('Kursi '+clash+' sudah diambil. Silakan pilih ulang.','err'); BW.seats=BW.seats.filter(x=>x!==clash); return refreshWiz(); }
  applyVoucherCalc();
  const sub=s.price*BW.seats.length, total=sub-BW.discount;
  const code='TA-'+Math.random().toString(36).slice(2,7).toUpperCase();
  const booking={id:uid('BK'),code,scheduleId:s.id,userEmail:u.email,
    passengers:BW.passengers.map(p=>({...p,pickup:BW.pickup||routeById(s.routeId).pickups[0]})),
    seats:[...BW.seats],subtotal:sub,discount:BW.discount,total,status:'pending',payMethod:PAY_METHOD,
    createdAt:new Date().toISOString(),paidAt:null,holdExpiry:new Date(Date.now()+15*60*1000).toISOString(),tripStatus:'scheduled'};
  const arr=DB.load('bookings',[]); arr.unshift(booking); DB.save('bookings',arr);
  const pays=DB.load('payments',[]); pays.unshift({id:uid('PAY'),bookingId:booking.id,amount:total,method:PAY_METHOD,status:'pending',time:new Date().toISOString(),fee:feeFor(s.agencyId,total)});
  DB.save('payments',pays);
  const v=DB.load('vouchers',[]).find(x=>x.code===BW.voucher&&x.active); if(v&&BW.discount>0){v.used++;DB.save('vouchers',v);}
  audit('booking_create',code+' • '+u.email+' • '+BW.seats.join(','));
  notify(u.email,'Booking dibuat — '+code,'Segera bayar '+fmtRp(total)+' sebelum hold 15 menit habis.','WA');
  showPaymentModal(booking);
  startHoldCountdown(booking.id);
}

let holdInt=null;
function startHoldCountdown(bid){
  clearInterval(holdInt);
  holdInt=setInterval(()=>{
    const b=DB.load('bookings',[]).find(x=>x.id===bid);
    const el=$('#holdTimer'); if(!b||!el){clearInterval(holdInt);return;}
    const ms=new Date(b.holdExpiry).getTime()-Date.now();
    if(ms<=0){clearInterval(holdInt);closeModal();toast('Hold kedaluwarsa — booking dibatalkan otomatis','err');go('tickets');return;}
    const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000);
    el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },1000);
}
function simulatePay(bid){
  const arr=DB.load('bookings',[]); const b=arr.find(x=>x.id===bid); if(!b) return;
  b.status='paid'; b.paidAt=new Date().toISOString(); DB.save('bookings',arr);
  const pays=DB.load('payments',[]); const p=pays.find(x=>x.bookingId===bid); if(p){p.status='paid';DB.save('payments',pays);}
  audit('payment_paid',b.code+' • '+fmtRp(b.total)); notify(b.userEmail,'Pembayaran berhasil — '+b.code,'E-tiket QR terbit. Tunjukkan ke pengemudi saat boarding.','WA+Email');
  clearInterval(holdInt); closeModal(); toast('Pembayaran sukses! E-tiket terbit.','ok'); BW={step:1,routeId:'R1',date:todayStr(1),scheduleId:null,seats:[],passengers:[],pickup:'',voucher:'',discount:0}; go('ticket-detail:'+bid);
}

function agenStats(agId){
  const sch=DB.load('schedules',[]).filter(s=>s.agencyId===agId);
  const bk=DB.load('bookings',[]).filter(b=>sch.some(s=>s.id===b.scheduleId)&&b.status!=='cancelled');
  const paid=bk.filter(b=>b.status==='paid'||b.status==='done');
  const rev=paid.filter(b=>schedById(b.scheduleId)?.date===todayStr(0)).reduce((a,b)=>a+b.total,0);
  const totRev=paid.reduce((a,b)=>a+b.total,0);
  const cap=sch.filter(s=>s.date===todayStr(0)).reduce((a,s)=>a+schedSeatCap(s.id),0)||1;
  const occ=sch.filter(s=>s.date===todayStr(0)).reduce((a,s)=>a+takenSeats(s.id).paid.length,0);
  return {rev,todayBk:bk.filter(b=>schedById(b.scheduleId)?.date===todayStr(0)).length,occ:Math.round(occ/cap*100),totRev,totBk:bk.length,sch};
}

function vPaintCell(i){
  const c=VLAY[i]; if(!c) return;
  if(VTOOL==='driver'){
    const r=Math.floor(i/4), a=r*4+2, b=r*4+3;
    if(VLAY[a].type==='driver'&&VLAY[b].type==='driver'){ vehSeatRefresh(); return; }
    for(const k of [a,b]){ const s=VLAY[k];
      if(s&&(s.type==='seat'||s.type==='off')&&s.sid&&VVID&&seatBookedFuture(VVID,s.sid)){ toast('Bangku '+s.sid+' sudah terbooking — pilih baris lain untuk pengemudi','err'); return; } }
    VLAY.forEach(x=>{ if(x.type==='driver'){ x.type='empty'; x.sid=null; } });
    VLAY[a]={sid:'DRV',type:'driver'}; VLAY[b]={sid:'DRV2',type:'driver'};
    vehSeatRefresh(); return;
  }
  let idx=[i];
  if(c.type==='driver'){ const r=Math.floor(i/4),a=r*4+2,b=r*4+3;
    if(VLAY[a]&&VLAY[a].type==='driver'&&VLAY[b]&&VLAY[b].type==='driver') idx=[a,b]; }
  for(const k of idx){ const s=VLAY[k];
    if(VTOOL==='seat'){
      if(s.type==='seat') continue;
      if(s.type==='off'){ s.type='seat'; continue; }
      const used=new Set(VLAY.map(x=>x.sid)); let n=1; while(used.has('A'+n)) n++; used.add('A'+n); if(n>VSEQ) VSEQ=n; s.type='seat'; s.sid='A'+n;
    }
    else if(VTOOL==='off'){ if(s.type!=='seat'){ if(idx.length===1) toast('Alat Nonaktif hanya untuk sel kursi','warn'); } else s.type='off'; }
    else if(VTOOL==='empty'){ s.type='empty'; s.sid=null; }
    else { s.type=VTOOL; s.sid=null; }
  }
  vehSeatRefresh();
}

  if(oldMail&&oldMail!==(d.userEmail||'').toLowerCase()){
    const stillUsed=DB.load('drivers',[]).some(x=>x.id!==d.id&&x.userEmail&&x.userEmail.toLowerCase()===oldMail);
    const ou=us.find(x=>x.email===oldMail&&x.role==='pengemudi');
    if(ou&&!stillUsed){ ou.status='suspended'; }
  }
  const want=d.status==='aktif'?'active':'suspended';
  let u=us.find(x=>x.email===(d.userEmail||'').toLowerCase()&&x.role==='pengemudi');
  if(u){ u.name=d.name; u.agencyId=d.agencyId; u.status=want; if(pass) u.pass=pass; }
  else {
    if(!pass){ toast('Password wajib untuk akun baru','err'); return false; }
    us.push({id:uid('U'),name:d.name,email:d.userEmail,phone:d.phone,wa:d.phone,pass,status:'suspended',role:'pengemudi',agencyId:d.agencyId,profileStep:'done',photo:''});
    u=us[us.length-1]; u.status=want;
  }
  DB.save('users',us); return true;
}
function delDrv(id){
  if(DB.load('schedules',[]).some(s=>s.driverId===id&&s.date>=todayStr(0))){ toast('Pengemudi punya jadwal aktif — tidak bisa dihapus','err'); return; }

  const d=driverById(id);
  DB.save('drivers',DB.load('drivers',[]).filter(x=>x.id!==id));
  if(d&&d.userEmail){ const em=d.userEmail.toLowerCase();
    const stillUsed=DB.load('drivers',[]).some(x=>x.userEmail&&x.userEmail.toLowerCase()===em);
    if(!stillUsed) DB.save('users',DB.load('users',[]).filter(x=>!(x.email===em&&x.role==='pengemudi')));
  }
  const rs=DB.load('routes',[]); let rc=false;
  rs.forEach(r=>{ const ids=(r.driverIds||[]).filter(x=>x!==id);

function tripUpdate(sid,st){

function saveRoute(){

  const p=$('#rgRoleP'), d=$('#rgRoleD');
  if(p) p.className='font-extrabold text-[13px] py-2.5 rounded-2xl border-2 '+(r==='pelanggan'?'border-sky-500 bg-sky-50 text-sky-700':'border-slate-200 text-slate-500');
  if(d) d.className='font-extrabold text-[13px] py-2.5 rounded-2xl border-2 '+(r==='agen'?'border-sky-500 bg-sky-50 text-sky-700':'border-slate-200 text-slate-500');
}
function pwToggle(id,btn){ const i=document.getElementById(id); if(!i) return;
  const show=i.type==='password'; i.type=show?'text':'password';
  if(btn){ btn.innerHTML=`<i data-lucide="${show?'eye-off':'eye'}" class="w-5 h-5 pointer-events-none"></i>`; window.lucide&&window.lucide.createIcons(); }
}
function doLogin(){
  const e=$('#liE').value.trim().toLowerCase(), p=$('#liP').value;
  const u=DB.load('users',[]).find(x=>x.email.toLowerCase()===e&&x.pass===p);
  if(!u){toast('Email / password salah','err');return;}
  if(u.role==='pengemudi'&&(u.status||'active')!=='active'){toast('Akun pengemudi dinonaktifkan — hubungi travel Anda','warn');return;}
  if(u.role==='agen'){ const agx=u.agencyId?agencyById(u.agencyId):null;
    if((u.status||'active')==='pending'||!agx||agx.status!=='active'){toast('Akun agen menunggu persetujuan super admin','warn');return;} }
  setSession(u); audit('login',u.email);
  toast('Halo, '+u.name+'! Masuk sebagai '+u.role);
  VIEW = u.role==='pelanggan'?'home':u.role==='agen'?'agen':u.role==='pengemudi'?'driver':'admin';
  AGEN_TAB='dashboard'; render();
}
function demoLogin(e,p){ const u=DB.load('users',[]).find(x=>x.email===e&&x.pass===p); if(!u)return; setSession(u); audit('login',u.email+' (demo)');
  VIEW=u.role==='pelanggan'?'home':u.role==='agen'?'agen':u.role==='pengemudi'?'driver':'admin'; AGEN_TAB='dashboard'; render(); toast('Masuk sebagai '+u.role+' — '+u.name); }
function doRegister(){
  const n=$('#rgN').value.trim(),e=$('#rgE').value.trim().toLowerCase(),ph=$('#rgP2').value.trim(),p=$('#rgP').value;
  if(!n||!e||!p) return toast('Lengkapi semua field','warn');
  if(DB.load('users',[]).some(x=>x.email.toLowerCase()===e)) return toast('Email sudah terdaftar','err');
  if(RG_ROLE==='agen'){
    const tname=($('#rgAgN')?.value||'').trim(), addr=(($('#rgAgA')?.value||'').trim());
    if(!tname||!addr){ toast('Isi nama & alamat travel','err'); return; }
    const agId=uid('AG');
    const ags=DB.load('agencies',[]);
    ags.push({id:agId,name:tname,logo:'',address:addr,phone:ph||'-',bank:'-',status:'pending',feeType:'percent',feeValue:8,refundPolicy:[{minH:72,pct:100},{minH:24,pct:50},{minH:0,pct:0}],rating:5.0,trips:0});
    DB.save('agencies',ags);
    const arr=DB.load('users',[]); arr.push({id:uid('U'),name:n,email:e,phone:ph,wa:ph,pass:p,role:'agen',agencyId:agId,status:'pending',photo:''}); DB.save('users',arr);
    audit('agency_register',tname+' • '+e);
    RG_ROLE='pelanggan'; go('login'); toast('Pendaftaran terkirim — menunggu persetujuan super admin','info'); return;
  }
  const u={id:uid('U'),name:n,email:e,phone:ph,pass:p,role:'pelanggan',agencyId:null,status:'active',favorites:[]};
  const arr=DB.load('users',[]); arr.push(u); DB.save('users',arr); setSession(u); audit('register',e);
  notify(e,'Akun dibuat','Selamat datang! Pakai kode HEMAT20 untuk diskon.','app'); VIEW='home'; render(); toast('Akun dibuat. Selamat datang, '+n+'!');
}
function doLogout(){ audit('logout',(currentUser()||{}).email||''); setSession(null); VIEW='home'; FILTER={q:'',date:'',status:''}; render(); toast('Keluar. Sampai jumpa!','info'); }

/* ---------- Notif drawer ---------- */
function openNotif(){
  const u=currentUser();
  const list=DB.load('notifications',[]).filter(n=>!u||n.to===u.email||n.to==='all').slice(0,20);
  openModal(`<div class="p-6"><div class="flex items-center justify-between"><h3 class="font-extrabold text-[16px] flex items-center gap-2"><i data-lucide="bell" class="w-5 h-5 text-sky-600"></i>Notifikasi</h3><button onclick="closeModal()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <div class="space-y-2 mt-3 max-h-[60vh] overflow-y-auto">${list.map(n=>`<div class="rounded-2xl p-3.5 ${n.read?'bg-slate-50':'bg-sky-50 border border-sky-200'}"><div class="flex items-center gap-2"><span class="font-extrabold text-[13px]">${esc(n.title)}</span><span class="badge bg-slate-200 text-slate-600 !text-[10px]">${esc(n.ch)}</span></div><div class="text-[12.5px] font-medium text-slate-600 mt-0.5">${esc(n.msg)}</div><div class="text-[11px] text-slate-400 mt-1">${new Date(n.time).toLocaleString('id-ID')}</div></div>`).join('')||'<div class="text-center text-slate-400 text-[13px] py-8">Tidak ada notifikasi</div>'}</div>
  <button onclick="markRead()" class="mt-3 w-full bg-slate-100 font-bold text-[12.5px] py-2.5 rounded-xl">Tandai semua dibaca</button></div>`);
  const dot=$('#notifDot'); if(dot) dot.classList.add('hidden');
}
function markRead(){ const u=currentUser(); const n=DB.load('notifications',[]); n.forEach(x=>{if(!u||x.to===u.email)x.read=true;}); DB.save('notifications',n); closeModal(); }

/* ---------- misc ---------- */
function emptyState(icon,title,sub){ return `<div class="text-center py-12"><i data-lucide="${icon}" class="w-14 h-14 text-slate-200 mx-auto"></i><div class="font-extrabold text-[16px] mt-2">${title}</div><p class="text-[13px] text-slate-500 font-medium">${sub}</p><button onclick="go('search')" class="mt-3 bg-[#0b2447] text-white text-[13px] font-extrabold px-6 py-2.5 rounded-xl">Cari Travel</button></div>`; }
function fmtDate(d){ try{return new Date(d+'T00:00').toLocaleDateString(LANG==='id'?'id-ID':'en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}catch(e){return d;} }

/* ---------- View dispatcher ---------- */
function renderView(u){
  const el=$('#app');
  if(u&&u.role!=='pelanggan'&&['home','search','tickets','history','profile'].includes(VIEW)){ VIEW=u.role==='agen'?'agen':u.role==='pengemudi'?'driver':'admin'; return render(); }
  if(VIEW.startsWith('ticket-detail:')){ if(!u) return go('login'); el.innerHTML=vTicketDetail(u,VIEW.split(':')[1]); return; }
  switch(VIEW){
    case 'home': el.innerHTML=vHome(u); break;
    case 'search': el.innerHTML=vSearch(u); break;
    case 'tickets': if(!u) return go('login'); el.innerHTML=vTickets(u); break;
    case 'history': if(!u) return go('login'); el.innerHTML=vHistory(u); break;
    case 'profile': if(!u) return go('login'); el.innerHTML=vProfile(u); break;
    case 'login': el.innerHTML=vLogin(); break;
    case 'register': el.innerHTML=vRegister(); break;
    case 'agen': case 'agen-book': case 'agen-sched': case 'agen-fleet': case 'agen-fin': case 'agen-drvform': case 'agen-vehform':
      if(!u) return go('login');
      if(VIEW==='agen-drvform'){ el.innerHTML=vDrvFormPage(u); break; }
      if(VIEW==='agen-vehform'){ el.innerHTML=vVehFormPage(u); break; }
      if(VIEW==='agen-book')AGEN_TAB='book'; if(VIEW==='agen-sched')AGEN_TAB='sched'; if(VIEW==='agen-fleet')AGEN_TAB='fleet'; if(VIEW==='agen-fin')AGEN_TAB='fin';
      el.innerHTML=vAgen(u); if(AGEN_TAB==='dashboard')drawAgenCharts(); break;
    case 'driver': case 'driver-trips': if(!u) return go('login'); el.innerHTML=vDriver(u,VIEW==='driver-trips'?'trips':'tasks'); break;
    case 'admin': case 'admin-tx': case 'admin-ag': case 'admin-master': if(!u) return go('login'); el.innerHTML=vAdmin(u); break;
    default: el.innerHTML=vHome(u);
  }
  // notif dot
  if(u){ const un=DB.load('notifications',[]).some(n=>n.to===u.email&&!n.read); $('#notifDot')?.classList.toggle('hidden',!un); }
}

/* H-1 reminder simulation */
(function(){ const bk=DB.load('bookings',[]); bk.forEach(b=>{ if((b.status==='paid')&&schedById(b.scheduleId)?.date===todayStr(1)&&!b.reminded){ b.reminded=true; notify(b.userEmail,'Pengingat H-1','Besok '+schedById(b.scheduleId).time+' WIB berangkat. Standby di titik jemput ya!','WA'); } }); DB.save('bookings',bk); })();

render();
</script>
